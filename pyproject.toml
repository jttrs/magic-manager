[project]
name = "magic-manager"
version = "0.1.0"
description = "Local-first MTG collection / set / wishlist / deck manager"
authors = [
    { name = "Jared Torre", email = "jared.torre@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "typer>=0.25.1",
    # Moxfield deck import/push: its api2 endpoint is Cloudflare-gated, so only a
    # real browser engine gets through. Chromium is NOT pulled by `uv sync` — run
    # `uv run playwright install chromium` once. Archidekt/MTGGoldfish don't need it.
    "playwright>=1.48",
]

[project.scripts]
mm = "magic_manager.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: pr-review
# CLAUDE.md rule 4: every PR carries a /ce-code-review + /findings-review stamp
# that matches its current changes (scripts/pr_review.py). Docs-only PRs are exempt.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  review-stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check the review stamp
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch -q origin "$BASE"
          # Run the BASE branch's checker so a PR can't weaken the check that judges it
          # (the head copy is used only while the base has none — the bootstrap PR).
          if git show "origin/$BASE:scripts/pr_review.py" > "$RUNNER_TEMP/pr_review.py" 2>/dev/null; then
            CHECKER="$RUNNER_TEMP/pr_review.py"
          else
            CHECKER=scripts/pr_review.py
          fi
          python3 "$CHECKER" check --base "origin/$BASE" --head HEAD

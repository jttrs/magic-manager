# Every PR / push to main: the vendor recipe book still parses its saved store
# pages (tests/fixtures/vendors) and the tab reader's rules hold. Offline.
name: Vendor recipes

on:
  pull_request:
    paths: ["config/vendors.toml", "src/magic_manager/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/vendor-recipes.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run pytest -q -p no:warnings tests/test_vendor_recipes.py tests/test_deals_tabs.py

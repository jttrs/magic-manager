# Every PR / push to main: the Linux image builds and the server answers
# (docs/webapp-architecture-decision.md §25, H7 — Docker is the vendor-move path).
name: Docker build

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", "scripts/**", "config/**", "web/**", ".claude/skills/**", ".github/workflows/docker-build.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: magic-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mm -p 8765:8765 magic-manager:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8765/api/features && break
            sleep 2
          done
          curl -fsS http://localhost:8765/api/features
          curl -fsS http://localhost:8765/ | grep -qi '<div id="root"'
          docker exec mm litestream version
          docker exec mm uv run --frozen --no-dev python -c "import magic_manager.offsite, magic_manager.hostops, magic_manager.objectstore"
          docker exec mm uv run --frozen --no-dev mm host litestream-config --data-dir /data --url file:///data/offsite --out - | grep -q 'pattern: "????????????????.db"'
      - if: failure()
        run: docker logs mm

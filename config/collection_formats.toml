# Collection CSV formats — one declarative [<service>] block per external
# collection service, loaded by magic_manager.config.collection_formats() and
# consumed by magic_manager.collection_sync (read_csv / write_csv). Adding a
# service is CONFIG, not code: declare its column names, finish/condition
# vocabulary, and write order here; collection_sync is fully service-agnostic.
#
# Per-service keys:
#   has_scryfall_id  bool  — does the CSV carry a Scryfall id column? ManaBox
#                            does (exact printing, no resolution). Moxfield /
#                            Archidekt / MTGGoldfish do not → resolve_rows fills
#                            it via (set, collector_number) against Scryfall.
#   confidence       str   — "high" (set+cn or scryfall_id present) | "low"
#                            (name-leaning, e.g. MTGGoldfish). Surfaced in the
#                            diff summary so the user knows how trustworthy the
#                            match is before approving.
#
#   [service.columns]  maps OUR normalized field → the service's CSV column
#     header. The read path (csv.DictReader) looks up each header; the write
#     path emits them. Only `quantity` + `finish` + an identity (scryfall_id OR
#     set+collector_number) are required; the rest are passthrough/diagnostic.
#       quantity, finish, scryfall_id, set, collector_number, name,
#       condition, purchase_price
#     A field whose column is "" (empty) is absent for that service: skipped on
#     read, omitted on write.
#
#   [service.finish_map]  maps the service's finish token (lowercased) → our
#     vocabulary ('nonfoil' | 'foil'). Any token absent from the map falls back
#     to 'nonfoil'. The write path inverts this (first key mapping to each value).
#
#   [service.condition_map]  maps the service's condition token (lowercased) →
#     our canonical condition. Passthrough-only in v1 (condition never enters the
#     DB — documented future-dimension hook), but normalized here so the round-
#     trip is stable. `write_default` is the condition emitted on export when a
#     row has none.
#
#   [service.app]  the import screen: `name` (shown to the user), `how`
#     (where the app's export lives — verified wording only), and `detect` —
#     header names that must ALL be in a file's header row for it to be read
#     as this service's export (collection_sync.detect_format).
#
#   Optional columns: `proxy` / `digital` — a true/yes/1 cell marks the row;
#     the web import skips and counts it (never imported), the CLI keeps it.
#
#   write_header / write_order  — the exact column ORDER emitted by write_csv
#     (a list of OUR normalized field names). Lets each service's export match
#     the header its importer expects.

# ---------------------------------------------------------------------------
# ManaBox (manabox.app) — the clean path: the app's CSV export carries a
# Scryfall ID column, so no network resolution is needed. Mobile-only app → no
# web automation (CSV file-exchange is the only transport). Export header:
#   Name,Set code,Set name,Collector number,Foil,Rarity,Quantity,ManaBox ID,
#   Scryfall ID,Purchase price,Misprint,Altered,Condition,Language,
#   Purchase price currency
# ---------------------------------------------------------------------------
[manabox]
has_scryfall_id = true
confidence = "high"

[manabox.app]
name   = "ManaBox"
how    = "Collection → menu (top right) → Export — the whole collection, or one binder or list."
detect = ["ManaBox ID", "Scryfall ID", "Collector number"]

[manabox.columns]
quantity         = "Quantity"
finish           = "Foil"
scryfall_id      = "Scryfall ID"
set              = "Set code"
collector_number = "Collector number"
name             = "Name"
condition        = "Condition"
purchase_price   = "Purchase price"

[manabox.finish_map]
normal  = "nonfoil"
foil    = "foil"
etched  = "foil"

[manabox.condition_map]
mint              = "mint"
near_mint         = "near_mint"
excellent         = "excellent"
good              = "good"
light_played      = "light_played"
played            = "played"
poor              = "poor"

[manabox.write]
# Column order emitted by write_csv (our normalized field names, mapped back to
# the service headers above). Matches the ManaBox import column expectations.
order = ["name", "set", "collector_number", "finish", "quantity", "scryfall_id",
         "condition", "purchase_price"]
# Condition emitted on export when a row carries none (passthrough-only in v1).
condition_default = "near_mint"


# ---------------------------------------------------------------------------
# Moxfield (collection / binder CSV export) — the ONLY id-less service. Header
# (verified against a real export 2026-10-02):
#   Count,Tradelist Count,Name,Edition,Condition,Language,Foil,Tags,
#   Last Modified,Collector Number,Alter,Proxy,Purchase Price
# Identity = Edition (set code) + Collector Number. Foil is "" (nonfoil) or
# "foil". GOTCHA: Moxfield re-exports a card added to a BINDER as a SEPARATE,
# byte-identical row (it won't let you move an existing collection card into a
# binder — you re-add it net-new, and it then shows in BOTH the main collection
# and the binder). read_csv SUMS same-(set,cn,finish) rows, so such a card
# imports at qty 2 — the diff-review step is where you catch/correct that before
# --apply. (Decided: sum, don't auto-dedupe — a legit 2nd copy would be lost.)
# ---------------------------------------------------------------------------
[moxfield]
has_scryfall_id = false
confidence = "high"              # exact (set, collector_number) printing

[moxfield.app]
name   = "Moxfield"
detect = ["Count", "Tradelist Count", "Edition", "Collector Number"]

[moxfield.columns]
quantity         = "Count"
finish           = "Foil"
set              = "Edition"
collector_number = "Collector Number"
name             = "Name"
condition        = "Condition"
purchase_price   = "Purchase Price"
proxy            = "Proxy"
# no scryfall_id column

[moxfield.finish_map]
# Moxfield leaves the Foil cell empty for nonfoil; "foil"/"etched" are foil.
foil   = "foil"
etched = "foil"
""     = "nonfoil"

[moxfield.condition_map]
"near mint"    = "near_mint"
mint           = "mint"
"lightly played" = "light_played"
"moderately played" = "played"
"heavily played" = "played"
damaged        = "poor"

[moxfield.write]
order = ["quantity", "name", "set", "condition", "finish", "collector_number",
         "purchase_price"]
condition_default = "Near Mint"


# ---------------------------------------------------------------------------
# Archidekt (collection CSV export) — HAS a Scryfall ID (plan assumed it didn't).
# Two export variants exist (default vs all-fields-checked); both share the
# columns we map, so ONE block covers both. Verified header (default variant):
#   Quantity,Name,Finish,Condition,Date Added,Language,Purchase Price,Tags,
#   Edition Name,Edition Code,Multiverse Id,Scryfall ID,Collector Number
# (the all-fields variant adds MTGO ID + prices + oracle id after Scryfall ID,
#  but the mapped headers are identical). Identity = Scryfall ID (exact).
# Finish tokens: Normal / Foil / Etched. Condition: NM/LP/MP/HP/DMG.
# ---------------------------------------------------------------------------
[archidekt]
has_scryfall_id = true
confidence = "high"

[archidekt.app]
name   = "Archidekt"
detect = ["Quantity", "Finish", "Edition Code", "Scryfall ID"]

[archidekt.columns]
quantity         = "Quantity"
finish           = "Finish"
scryfall_id      = "Scryfall ID"
set              = "Edition Code"
collector_number = "Collector Number"
name             = "Name"
condition        = "Condition"
purchase_price   = "Purchase Price"

[archidekt.finish_map]
normal = "nonfoil"
foil   = "foil"
etched = "foil"

[archidekt.condition_map]
nm  = "near_mint"
m   = "mint"
lp  = "light_played"
mp  = "played"
hp  = "played"
dmg = "poor"

[archidekt.write]
order = ["quantity", "name", "finish", "condition", "set", "collector_number",
         "scryfall_id", "purchase_price"]
condition_default = "NM"


# ---------------------------------------------------------------------------
# MTGGoldfish (collection CSV export: my_collection.csv) — carries a Scryfall ID
# but it is BLANK for some promos, and Set ID is a NON-Scryfall code
# (uppercase "FIN", and PRM-* pseudo-sets like "PRM-WPN" with MTGGoldfish-internal
# collector numbers). Verified header:
#   Card UUID,Card,Set ID,Set Name,Quantity,Foil,Tags,Collector Number,Scryfall ID
# Resolution: Scryfall ID when present (most rows) → else (set, cn) after the
# set-code remap below. The PRM-* promos have NEITHER a usable id NOR a
# Scryfall-matching (set, cn) — their internal CN differs from Scryfall's — so
# they honestly land in not_found (reported, never guessed). confidence=low
# reflects this tail; the set_remap only fixes code-only mismatches, not the
# PRM-* internal-numbering ones.
# ---------------------------------------------------------------------------
[mtggoldfish]
has_scryfall_id = true           # present on most rows; blank ones fall back to (set,cn)
confidence = "low"

[mtggoldfish.app]
name   = "MTGGoldfish"
detect = ["Card UUID", "Set ID", "Scryfall ID"]

[mtggoldfish.columns]
quantity         = "Quantity"
finish           = "Foil"
scryfall_id      = "Scryfall ID"
set              = "Set ID"
collector_number = "Collector Number"
name             = "Card"
# MTGGoldfish has no per-card condition column.

[mtggoldfish.finish_map]
regular = "nonfoil"
foil    = "foil"
etched  = "foil"

# MTGGoldfish Set ID → Scryfall set code remap. MTGGoldfish uppercases codes
# (handled by read_csv's lowercasing already) and uses PRM-* pseudo-sets for
# promos. Only CODE-level differences are fixable here; PRM-* rows whose
# collector number is MTGGoldfish-internal still won't match a Scryfall printing
# and will report as not_found. Seed sparingly with VERIFIED mappings only.
[mtggoldfish.set_remap]
# (none verified yet — add "mtggoldfish_code" = "scryfall_code" as encountered)

[mtggoldfish.write]
order = ["quantity", "name", "finish", "set", "collector_number", "scryfall_id"]
condition_default = "near_mint"


# ---------------------------------------------------------------------------
# Deckbox (deckbox.org) — Inventory → Export. Current header (verified against
# real exports 2025-26, StepKie/MtgCsvHelper Tests/deckbox-real-export.csv):
#   Count,Tradelist Count,Name,Edition,Edition Code,Card Number,Condition,
#   Language,Foil,Signed,Artist Proof,Altered Art,Misprint,Promo,Textless,
#   Printing Id,Printing Note,Tags,My Price,Cost,Rarity,Price,TcgPlayer ID,
#   Scryfall ID
# Identity = Scryfall ID (exact even where Deckbox reshapes Card Number, e.g.
# LTR 741z → 741), else Edition Code + Card Number. `Edition` is Deckbox's own
# set NAME (not used). Foil = "" | "foil" (etched collapses to foil). Older
# minimal exports without Edition Code / Scryfall ID are NOT detected
# (set name only — no exact printing); re-export from Deckbox.
# ---------------------------------------------------------------------------
[deckbox]
has_scryfall_id = true
confidence = "high"

[deckbox.app]
name   = "Deckbox"
how    = "Inventory → Export (top right) → CSV."
detect = ["Count", "Tradelist Count", "Edition Code", "Card Number"]

[deckbox.columns]
quantity         = "Count"
finish           = "Foil"
scryfall_id      = "Scryfall ID"
set              = "Edition Code"
collector_number = "Card Number"
name             = "Name"
condition        = "Condition"

[deckbox.finish_map]
foil = "foil"
""   = "nonfoil"

[deckbox.set_remap]
plist = "plst"        # The List (Deckbox code → Scryfall)

[deckbox.write]
order = ["quantity", "name", "set", "collector_number", "finish", "condition", "scryfall_id"]
condition_default = "Near Mint"


# ---------------------------------------------------------------------------
# Dragon Shield MTG Card Manager — the WEBSITE export (mtg.dragonshield.com).
# First line is literally "sep=," (quoted), then (verified, real exports in
# StepKie/MtgCsvHelper Tests/dragonshield-real-export.csv and
# Chazmus/dragonshield-converter tests/resources/dragon-shield.csv):
#   Folder Name,Quantity,Trade Quantity,Card Name,Set Code,Set Name,
#   Card Number,Condition,Printing,Language,Price Bought,Date Bought,LOW,MID,MARKET
# (the last three price columns vary by price source). No Scryfall id —
# identity is Set Code + Card Number. `Printing` is open-ended (Normal, Foil,
# Etched, Rainbow Foil, Surge Foil, …) → anything containing "foil" or
# "etched" is foil (foil_contains). The phone app writes a different,
# unverified header and is not supported yet.
# ---------------------------------------------------------------------------
[dragonshield]
has_scryfall_id = false
confidence = "high"
foil_contains = ["foil", "etched"]

[dragonshield.app]
name   = "Dragon Shield"
how    = "On mtg.dragonshield.com, open a folder → Export CSV (the website’s export, not the phone app’s)."
detect = ["Folder Name", "Quantity", "Trade Quantity", "Card Name", "Set Code", "Card Number", "Printing"]

[dragonshield.columns]
quantity         = "Quantity"
finish           = "Printing"
set              = "Set Code"
collector_number = "Card Number"
name             = "Card Name"
condition        = "Condition"
purchase_price   = "Price Bought"

[dragonshield.set_remap]
gk2_azoriu = "gk2"    # Guild Kit: Azorius
gk1_dimir  = "gk1"    # Guild Kit: Dimir

[dragonshield.write]
order = ["quantity", "name", "set", "collector_number", "condition", "finish"]
condition_default = "NearMint"


# ---------------------------------------------------------------------------
# TCGplayer app (phone scanner) — Settings → Email Export → CSV. Columns are
# user-configurable; the full header (verified, EchoMTG/mtg-csv-reader
# example_datasets/tcgplayer + MTGGoldfish's import docs):
#   Quantity,Name,Simple Name,Set,Card Number,Set Code,Printing,Condition,
#   Language,Rarity,Product ID,SKU
# Identity = Set Code + Card Number (Card Number and Set Code must be switched
# on). Printing = Normal | Foil. `Name` carries TCGplayer decorations
# ("(Borderless)") — diagnostic only.
# ---------------------------------------------------------------------------
[tcgplayer]
has_scryfall_id = false
confidence = "high"

[tcgplayer.app]
name   = "TCGplayer app"
how    = "Settings → Email Export → CSV, with Card Number and Set Code turned on under CSV Output Settings; then export from the Collection tab."
detect = ["Quantity", "Name", "Simple Name", "Card Number", "Set Code", "Printing"]

[tcgplayer.columns]
quantity         = "Quantity"
finish           = "Printing"
set              = "Set Code"
collector_number = "Card Number"
name             = "Name"
condition        = "Condition"

[tcgplayer.finish_map]
normal = "nonfoil"
foil   = "foil"

[tcgplayer.set_remap]
list = "plst"         # The List

[tcgplayer.write]
order = ["quantity", "name", "set", "collector_number", "finish", "condition"]
condition_default = "Near Mint"


# ---------------------------------------------------------------------------
# Delver Lens (Android scanner) — no native CSV: Export picks a per-site preset
# (Moxfield, Archidekt, Deckbox, TCGplayer, …), which detection reads as that
# site's format. This block is its custom preset (verified sample,
# EchoMTG/mtg-csv-reader example_datasets/delver):
#   Name,Acquired Price,Language,Set Code,TCGPlayer Product ID,Number,Foil,Quantity
# Foil = "Foil" | "". Its EchoMTG preset (Reg Qty/Foil Qty + set NAME, no
# number) has no exact printing and is not supported.
# ---------------------------------------------------------------------------
[delverlens]
has_scryfall_id = false
confidence = "high"

[delverlens.app]
name   = "Delver Lens"
how    = "Export a list as CSV with its own CSV preset. Other presets read as the app they copy when they carry set codes and collector numbers."
detect = ["Name", "Acquired Price", "Set Code", "TCGPlayer Product ID", "Number", "Foil", "Quantity"]

[delverlens.columns]
quantity         = "Quantity"
finish           = "Foil"
set              = "Set Code"
collector_number = "Number"
name             = "Name"
purchase_price   = "Acquired Price"

[delverlens.finish_map]
foil = "foil"
""   = "nonfoil"

[delverlens.write]
order = ["name", "set", "collector_number", "finish", "quantity"]
condition_default = ""

# Feature flags: one table per flag. Defaults ship OFF for anything internal-only.
#   default    the value when nothing else says otherwise
#   title      short label for the flag picker (<= 24 chars)
#   about      one plain sentence (<= 80 chars), ending in "."
#   kind       release (ships on once ready; needs review_by) | ops | permission
#   added / review_by   ISO dates; a release flag is reviewed (turned on or removed) by review_by
#
# Precedence, lowest first: this file < config/features.local.toml (git-ignored,
# `[features]\n name = true`) < "everyone" (set at runtime from the flag picker /
# `mm flags set`, stored in auth.db) < MM_FEATURES env (pin; comma list, "-name" = off)
# < hosted only: a per-user override (flag picker "just me" / Admin page / `mm auth flag`).
# Paths that run on the owner's machine or logins (owner_machine.PATHS) stay admin-only
# when hosted, whatever these flags say.

[flags.cart_check]
default = false
title = "Cart check"
about = "Audit a store cart against your collection."
kind = "release"
added = "2026-06-01"
review_by = "2027-03-31"


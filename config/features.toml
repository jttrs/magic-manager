# Feature flags. Defaults ship OFF for anything internal-only.
#
# Turn a flag on for this machine without committing it:
#   config/features.local.toml (git-ignored), e.g.  [features]\n cart_check = true
#   or the environment:  MM_FEATURES=cart_check  (comma list; "-name" forces off)
# Precedence: environment > features.local.toml > this file.

[features]
# Read your Mana Pool cart and audit it against your collection. Internal: read
# with your own login from the Keychain, or in your browser by the browser
# companion / cart bookmarklet (only cart lines reach the app).
cart_check = false
# Read your open browser tabs (macOS) and price store product pages against
# market. Internal: local-machine browser access.
deals = false
# The Analytics dashboard (error trends, usage, sessions). Internal: it shows
# every user's pseudonymous activity, so only the owner/admin turns it on.
# (Recording itself is governed by each user's consent, not by this flag.)
analytics = false
# The browser companion (extension/): setup panel, extension download, and
# reading the cart, store tabs and Moxfield decks in your own browser.
# Internal while it's in beta.
companion = false

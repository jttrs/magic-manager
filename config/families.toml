[[unobtainable.snc.rules]]
promo_types_any_of = ["stamped"]
note = "Promo-pack + prerelease STAMP variants the user does not shop for (2026-08-24). Prints across pncc (NCC commander promos), psnc (prerelease/promo-pack), snc. They're the same card as the base with a promo stamp, priced 10-30x on scarcity (Currency Converter pncc 81p ~$182 vs base ncc 81 ~$5). Normally the global preferred filter drops promopack/stamped, but these lack a non-stamped sibling in the family graph so they survive — this rule removes them explicitly.  Signal is `stamped` ONLY, not `promopack` (corrected 2026-08-26): the promo-pack STAMP always carries `stamped`; but 5 borderless alt-arts (snc 463-467, inverted frame) are `promopack` WITHOUT `stamped` — a distinct art the user WANTS. Matching on `promopack` would wrongly drop those 5. See docs/sets/snc.md §5."

[[unobtainable.snc.rules]]
promo_types_any_of = ["stepandcompleat"]
tier = "chase"
note = "stepandcompleat: the Phyrexian \"Step-and-Compleat\" premium foil — SNC 469 Urabrask is the same borderless concept art as SNC 468, just that fancy foil process (foil-only, ~2x price). It computes to treatment 'b' (not 'ff'), so the dupe-foil step doesn't catch it; exclude it here as a fancy-foil variant the user doesn't chase. Single print in family. See docs/sets/snc.md §2/§5."

[[unobtainable.sos.rules]]
promo_types_any_of = ["headliner", "serialized"]
tier = "chase"
note = "Secrets of Strixhaven serialized headline chase (added 2026-08-28). sos 306 Emeritus of Ideation // Ancestral Recall — headliner + rainbowfoil + serialized, foil-only, ~$2,900. Analog of EOE Sothera / ECL Bitterbloom Bearer."

[[unobtainable.sos.rules]]
promo_types_any_of = ["stamped"]
note = "Promo-pack STAMP variants: all 80 `psos` cards are `promopack`+`stamped` — same card as a kept base sibling + a stamp. Validated all 80 have a non-stamped sibling (safe to drop); the 5 `promopack`-ONLY guild Charm alt-arts (sos 363-367, no `stamped`) are KEPT. Signal is `stamped` ONLY, like SNC/EOE/ECL. See docs/sets/sos.md §5."

[[unobtainable.spg.rules]]
promo_types_any_of = ["dragonscalefoil", "neonink"]
tier = "chase"
note = "Two DISTINCT-ART ultra-premium foil tiers the user won't chase (~$4,800): - neonink: 6 Mana Crypt neon colorways (spg 17a-d etc., foil-only, up to ~$496 ea). Distinct art per colorway (0 illustration_id match to the boosterfun 17), so NOT a dupe — the dupe filter would keep them; this rule removes them. Direct analog of the fin/lci/neo neonink exclusions. - dragonscalefoil: 5 fetchlands (spg 114-118, foil-only, $369-$594). Distinct art (0 illustration_id match to the boosterfun fetch), a premium foil tier not chased. any_of because the two tokens never co-occur; matching either catches exactly these 11 prints. The boosterfun base prints of every card stay in scope. See docs/sets/spg.md §5."

[[unobtainable.spm.rules]]
promo_types_any_of = ["textured"]
tier = "chase"
note = "Textured comic-panel masterpiece foils — the 7 Spectacular Spider-Man textured prints (SPM 235-241, textured+boosterfun, foil-only, $199-$446 ea, ~$1,950 total). DISTINCT art (7 different illustration_ids, a themed multi-art chase — NOT dupes of the base #14, which is why they are correctly OUT of FAMILY_DUPE_FOIL_PROMO_TYPES per docs/sets/spm.md §2). A fancy-foil scarcity tier the user won't chase; any_of:{textured} catches exactly these 7. (2026-09-07 user directive.)"

[[unobtainable.spm.rules]]
collector_numbers = ["243"]
border_color = "borderless"
tier = "chase"
note = "The Soul Stone borderless foil (SPM 243, ~$1,839) — the family's flagship $ chase. Distinct borderless-inverted boosterfun art; no promo_type distinguishes it from ordinary boosterfun mythics, so pinned by CN + border_color (same technique as MSH Mind Stone 386). The base/other prints of The Soul Stone stay in scope. (2026-09-07 user directive.)"

[[unobtainable.tdm.rules]]
promo_types_any_of = ["stamped"]
note = "Promo-pack STAMP variants — ptdm `Np` promopack+stamped prints, same card as a kept base/showcase sibling + a stamp; compute to `regular` (bypass preferred dedup) and would leak ~$689 into missing-set. Mirrors the ONE family's `stamped` rule. See docs/sets/tdm.md §5."

[[unobtainable.tdm.rules]]
promo_types_any_of = ["doublerainbow", "headliner", "serialized"]
note = "Documented no-op (parity with INR/ACR/ONE): TDM 419 Mox Jasper (serialized+headliner+doublerainbow, ~$2,750) — `serialized` is already in the GLOBAL UNOBTAINABLE_PROMO_TYPES, so 419 never reaches missing-set regardless. Kept for discoverability. See docs/sets/tdm.md §5."

[[unobtainable.tla.rules]]
promo_types_any_of = ["headliner", "neonink", "raisedfoil"]
tier = "chase"
note = "Chase-tier premiums the user does not shop for. All foil-only, extreme-rarity Play Booster pulls with unique art (so they're NOT fancy-foil dupes — the dupe filter would keep them; this rule is what removes them from missing-set): - neonink: the 4-card themed premium (TLA 359-362, Aang/Zuko/ Katara/Toph by Flavio Girón), ~$460-$890 each. - headliner + raisedfoil: TLA 363 Avatar Aang (Bryan Konietzko, the show's co-creator), the set's headline ultra-rare, ~$3,900. any_of because neonink and headliner/raisedfoil never co-occur on the same print; matching any one of the three catches exactly these 5 cards and nothing else in the TLA family (verified 2026-07-21)."

[[unobtainable.tmt.rules]]
promo_types_any_of = ["headliner"]
tier = "chase"
note = "The 4 borderless Turtle headliners (TMT 301-304 — Leonardo/Donatello/ Raphael/Michelangelo), foil-only, ~$2,175-$2,957 each, ~$10,232 total (~92% of tmt's missing $). Direct analog of TLA's Avatar Aang / EOE Sothera headliner chase: distinct borderless art (so the dupe-foil filter KEEPS them; this rule is what removes them). `headliner` matches exactly these 4 prints in the family and nothing else (verified DB, 2026-09-13); each Turtle keeps its base + showcase prints (e.g. Leonardo TMT 17/215) in scope. The user does not chase these BY DEFAULT (surfaceable via --chase include/only). See docs/sets/tmt.md §5."

[[unobtainable.tmt.rules]]
promo_types_any_of = ["surgefoil"]
border_color = "borderless"
tier = "chase"
note = "tmc CN 83-97 surgefoil borderless showcase sheet — 15 prints, all surgefoil+borderless+inverted, foil-only, distinct illustration_ids from their base siblings, $37-$310 each (~$1,870 total). Premium-art chase tier excluded by default, surfaceable via --chase include/only. The surgefoil+borderless signature matches exactly these 15 in the family (the surgefoil basic-land dupes — e.g. tmt 309 Forest — are black-bordered and already drop as dupe-foil, so this rule neither needs nor affects them). Added 2026-10-02: before it, the art-blind dupe-foil filter wrongly dropped 6 of the 15 (CN 83/85/89/91/92/96, whose base sibling is also borderless) and kept 9 — now all 15 are a coherent chase tier. Analog of MSH surgefoil / OTJ textured chase. See docs/sets/tmt.md §5."


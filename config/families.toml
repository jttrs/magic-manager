[[unobtainable.eoe.rules]]
promo_types_any_of = ["galaxyfoil", "headliner", "singularityfoil"]
tier = "chase"
note = "Chase-tier premiums the user does not shop for (2026-08-23 directive). - headliner / singularityfoil: EOE 382 Sothera, the Supervoid — the set's headline ultra-rare (poster + singularityfoil), ~$1,223. Direct analog of TLA's Avatar Aang headliner. Exactly 1 print. - galaxyfoil: the \"Stellar Sights\" (EOS) premium foil masterpiece lands + a few EOE galaxyfoil mythics (Ancient Tomb, Mana Confluence, Gemstone Caverns, etc.), ~$60-$475 each — 105 prints across eoe+eos. These are the fancy-foil versions; the user still sees the non-galaxyfoil EOS/EOE print of the same card if one exists (e.g. EOS 1/46 Ancient Tomb boosterfun remain in the list). any_of because headliner/singularityfoil and galaxyfoil never co-occur; matching any one catches exactly these chase prints."

[[unobtainable.eoe.rules]]
promo_types_any_of = ["stamped"]
note = "Promo-pack/prerelease STAMP variants (added 2026-08-26, mirroring SNC). 80 stamped prints (mostly peoe) — same card as a kept base/boosterfun sibling, priced on scarcity (Quantum Riddler peoe 72p ~$38 vs base eoe 72 ~$33 + boosterfun eoe 305, both kept). Signal is `stamped` ONLY: validated that all 80 dupes carry `stamped`, while 5 borderless alt-arts (eoe 393-397, inverted frame) are `promopack` WITHOUT `stamped` and must stay. Effect: missing-set drops ~$291 (217→137 prints). See docs/sets/eoe.md §5."

[[unobtainable.fdn.rules]]
promo_types_any_of = ["stamped"]

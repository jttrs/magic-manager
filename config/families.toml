# Per-family treatment/unobtainable config (selectors.py).
#
# REQUIRED: config.py raises ConfigError if this file is missing or unparseable
# (unlike promo_types.toml / precon.toml, which have baked-in defaults). Three sections:
#   [dupe_foil]       family -> fancy-foil promo_types that mark a same-art dupe
#                     (collapsed by the preferred filter). Empty = no dupe signal.
#   [[unobtainable.<fam>.rules]]  predicate rules for prints the user won't pursue;
#                     each rule's `note` is the rationale (travels WITH the rule).
#                     `enabled = false` marks a PROPOSED rule: it is loaded into
#                     selectors.FAMILY_PROPOSED_RULES, not FAMILY_UNOBTAINABLE_RULES,
#                     so it excludes nothing until the line is deleted (or set true).
#   [[scenes.<fam>]]  poster/scene groupings (scenes.py: Collection "Scene" group +
#                     scene_table.py). Keys: name, artist, set, cn_lo, cn_hi,
#                     optional kind = "scene" (default) | "poster".
#
# Predicate keys (AND within a rule, OR across a family's rules):
#   promo_types_any_of / promo_types_all_of / frame_effects_all_of (lists),
#   set_codes (list of set codes: the print's own set, e.g. a promo set `pala`),
#   border_color (string), collector_numbers (list of CN strings).
# Non-predicate keys: tier ("hard" default | "chase"), enabled (bool, default true), note.


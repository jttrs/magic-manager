[[unobtainable.acr.rules]]
promo_types_any_of = ["doublerainbow", "serialized"]
note = "Assassin's Creed headline serialized chase — ACR 120z Mary Read and Anne Bonny (serialized + doublerainbow, foil-only, ~$600). NOTE: a documented no-op — `serialized` is already in the GLOBAL UNOBTAINABLE_PROMO_TYPES, so 120z never reaches missing-set regardless (verified identical result with/without). Kept for parity with the INR/ECL/SOS headliner families. See docs/sets/acr.md §5."

[[unobtainable.afr.rules]]
frame_effects_all_of = ["showcase"]
border_color = "black"
tier = "chase"
note = "Same UNWANTED showcase as CLB — AFR and CLB share the SAME Universes Beyond: D&D \"rulebook/module-page\" showcase frame (verified 2026-09-30: both frame_effects:showcase[+legendary], promo_types:boosterfun, same D&D block). The 60 showcase prints (afr 299-358) are black-bordered and compute to `shw`, which `preferred` otherwise keeps. The border_color guard SPARES the 17 borderless planeswalkers + Dragons (afr 282-298, incl. Tiamat / Old Gnawbone) — borderless is the chase the user keeps. The 38 extendedart (afr 359-396) + the afc commander-deck extendedart (afc 274-329) already drop via the generic `ext` exclusion; afc has NO showcase. See docs/sets/afr.md §2/§5."

[[unobtainable.blb.rules]]
promo_types_any_of = ["stamped"]
note = "Promo-pack STAMP variants (added 2026-08-30). All 80 `pblb` `promopack`+`stamped` `Np` prints are the same card as a kept base sibling + a promo-pack stamp, priced on scarcity. They compute to `regular` treatment, so the rare/mythic-regular sub-selectors pick them up (they bypass the `preferred` dedup) — this rule removes them. Validated: all 80 promopack cards also carry `stamped`, so a `stamped` rule catches every one; the 5 `promopack`-ONLY inverted-frame alt-arts (blb 381-385 Hop to It / Shoreline Looter / Fell / Wear Down / Stormcatch Mentor — distinct art, base siblings at blb 16/70/95/203/234) carry NO `stamped` and are KEPT. Signal is `stamped` ONLY, like SNC/EOE/ECL/SOS."

[[unobtainable.blb.rules]]
promo_types_any_of = ["raisedfoil"]
tier = "chase"
note = "raisedfoil premium-foil chase tier (added 2026-08-30). The 21 `raisedfoil` showcase-legend foils are a fancy-foil variant the user does not shop for — same stance as SNC gilded/stepandcompleat. Unlike a DUPE_FOIL entry (which only drops the 7 that dupe a boosterfun- showcase twin), the 14 sole-showcase raisedfoils print ONLY in raisedfoil (no regular-foil of that art) — Ms. Bumbleflower blc 103 ~$1,380, Lumra blb 343 ~$802, Bello blc 101 ~$559, etc., $5,701 of the $7,016 total. any_of:{raisedfoil} catches all 21; the base and boosterfun-showcase prints of each card stay in scope. Effect combined with the stamped rule: missing-set 484→383 prints ($7,302→~$1,315). See docs/sets/blb.md §2/§5."

[[unobtainable.clb.rules]]
frame_effects_all_of = ["showcase"]
border_color = "black"
tier = "chase"
note = "Showcase frame is UNWANTED for CLB (2026-09-30 user directive): the Universes Beyond: D&D \"rulebook/module-page\" showcase style isn't liked. The 76 showcase prints (clb 375-450) all carry frame_effects:showcase + border_color:black and compute to treatment `shw`, which `preferred` otherwise KEEPS as a separately-wanted printing. The `border_color:black` guard SPARES the 3 borderless-showcase planeswalkers (clb 362-364 Elminster/Minsc & Boo/Tasha) and the 10 borderless Dragons/legends (365-374) — borderless is the chase the user DOES want (keep). NOTE: etched-foil (clb 471-534, finishes:etched → treatment `b|ff`) and BOTH extended-art bands (set 553-645 + deck-card 936, frame `ext`) are ALREADY dropped by the generic pipeline (ff-dupe collapse + the `ext` exclusion in `preferred`), so no rule is needed for them. See docs/sets/clb.md §2/§5."

[[unobtainable.dft.rules]]
promo_types_any_of = ["firstplacefoil"]
tier = "chase"
note = "firstplacefoil (DFT 427-553) — 127 \"First Place\" box-topper foils, same art as the BASE (not boosterfun) on a podium-inverted foil sheet; compute to b|ff while base is empty, so DUPE_FOIL can't pair them (MAT/MSH frame- mismatch trap). All have a base sibling; ~$1,041 the user won't chase. firstplacefoil is dft+spg only globally. See docs/sets/dft.md §5."

[[unobtainable.dft.rules]]

[[unobtainable.blb.rules]]
promo_types_any_of = ["stamped"]
note = "Promo-pack STAMP variants (added 2026-08-30). All 80 `pblb` `promopack`+`stamped` `Np` prints are the same card as a kept base sibling + a promo-pack stamp, priced on scarcity. They compute to `regular` treatment, so the rare/mythic-regular sub-selectors pick them up (they bypass the `preferred` dedup) — this rule removes them. Validated: all 80 promopack cards also carry `stamped`, so a `stamped` rule catches every one; the 5 `promopack`-ONLY inverted-frame alt-arts (blb 381-385 Hop to It / Shoreline Looter / Fell / Wear Down / Stormcatch Mentor — distinct art, base siblings at blb 16/70/95/203/234) carry NO `stamped` and are KEPT. Signal is `stamped` ONLY, like SNC/EOE/ECL/SOS."

[[unobtainable.blb.rules]]
promo_types_any_of = ["raisedfoil"]
tier = "chase"
note = "raisedfoil premium-foil chase tier (added 2026-08-30). The 21 `raisedfoil` showcase-legend foils are a fancy-foil variant the user does not shop for — same stance as SNC gilded/stepandcompleat. Unlike a DUPE_FOIL entry (which only drops the 7 that dupe a boosterfun- showcase twin), the 14 sole-showcase raisedfoils print ONLY in raisedfoil (no regular-foil of that art) — Ms. Bumbleflower blc 103 ~$1,380, Lumra blb 343 ~$802, Bello blc 101 ~$559, etc., $5,701 of the $7,016 total. any_of:{raisedfoil} catches all 21; the base and boosterfun-showcase prints of each card stay in scope. Effect combined with the stamped rule: missing-set 484→383 prints ($7,302→~$1,315). See docs/sets/blb.md §2/§5."


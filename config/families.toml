tier = "chase"
note = "Smaug the Magnificent (hob 249) — headliner+gleaminggold, foil-only, ~$22,250, the set's headline ultra-rare (analog of TLA Avatar Aang / EOE Sothera / ECL Bitterbloom Bearer / MSH Mind Stone). It computes to an EMPTY treatment (not `regular`-excluded, not `ff`-dupe), so it leaks into the mythic-regular sub-selector — 93% of hob's raw missing $. Both `headliner` and `gleaminggold` are exclusive to this one print in the family (verified 1 each), so any_of catches exactly Smaug 249. See docs/sets/hob.md §5."

[[unobtainable.inr.rules]]

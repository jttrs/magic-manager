# Curated FUNCTION roots over Scryfall Tagger's oracle-tag hierarchy
# (consumed by magic_manager.scryfall_tags via config.load_function_tags).
#
# A card's "functions" = every root whose subtree (the root tag(s) + all
# descendants via child_ids) tags the card. Roots are keyed on the Tagger tag
# UUID (`id`) — slugs/labels can be renamed upstream; `slug` is a readable
# fallback used only when the UUID disappears from the bulk file.
#
# This file is OPTIONAL — config.py ships the same defaults baked in.
# Choices (inspected against the oracle_tags bulk file, 2026-10-04):
#   - Card draw = `draw` (textual draw, 35 descendants), NOT `card-advantage`
#     (which also pulls regrowth/impulse/tome — broader than "draw").
#   - Removal = `removal`; it CONTAINS `sweeper`, so a wrath is in both Removal and
#     Board wipe — expected (a card may serve several functions).
#   - Token maker: Tagger has no single "creates tokens" tag; union of
#     `repeatable-token-generator` (engines) + `multiple-bodies` (one-shot spells
#     that make 2+ creatures).
#   - Evasion = `gives-evasion` (grants evasion to others). The `evasion` tag tags
#     every flyer (~5.6k cards) — a keyword, not a deck function.
#   - Counterspell's upstream parent is `blue-effect`; we root at `counterspell`.

# Max oracle tags shown per card in previews (highest weight first).
preview_limit = 6

# Structural / meta subtrees never shown as a card's preview tags.
preview_exclude = [
  "card-names", "cycle", "flavors-of-vanilla", "type-errata", "unique-type-line",
  "triggered-ability", "activated-ability", "cheaper-than-mv",
  "more-expensive-than-mv", "staple-with-set-s-mechanic", "token-errata",
  "single-target-instant-sorcery", "drawback", "meme",
]

[[roots]]
key = "ramp"
label = "Ramp"
tags = [{ id = "2f3e4ad7-5e60-41b4-bdbc-653f16869cf6", slug = "ramp" }]

[[roots]]
key = "draw"
label = "Card draw"
tags = [{ id = "b6448c45-ce65-4848-aa98-2151e4e07437", slug = "draw" }]

[[roots]]

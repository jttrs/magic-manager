# Curated FUNCTION roots over Scryfall Tagger's oracle-tag hierarchy
# (consumed by magic_manager.scryfall_tags via config.load_function_tags).
#
# A card's "functions" = every root whose subtree (the root tag(s) + all
# descendants via child_ids) tags the card. Roots are keyed on the Tagger tag
# UUID (`id`) — slugs/labels can be renamed upstream; `slug` is a readable
# fallback used only when the UUID disappears from the bulk file.
#
# This file is OPTIONAL — config.py ships the same defaults baked in.
# Choices (inspected against the oracle_tags bulk file, 2026-10-04):
#   - Card draw = `draw` (textual draw, 35 descendants), NOT `card-advantage`
#     (which also pulls regrowth/impulse/tome — broader than "draw").
#   - Removal = `removal`; it CONTAINS `sweeper`, so a wrath is in both Removal and
#     Board wipe — expected (a card may serve several functions).
#   - Token maker: Tagger has no single "creates tokens" tag; union of
#     `repeatable-token-generator` (engines) + `multiple-bodies` (one-shot spells
#     that make 2+ creatures).
#   - Evasion = `gives-evasion` (grants evasion to others). The `evasion` tag tags
#     every flyer (~5.6k cards) — a keyword, not a deck function.
#   - Counterspell's upstream parent is `blue-effect`; we root at `counterspell`.
#
# 2026-11 expansion (owner feedback: the filter felt sparse — 99.9% of owned
# cards carry Tagger tags, but the 12 roots left ~3.0k of ~9.2k owned cards with
# no function). Owned-card coverage measured on the real collection, roll-up
# through descendants:
#   - Ramp stays as the umbrella root with three narrower roots beside it, like
#     Removal ⊃ Board wipe: Mana rocks = `mana-rock`, Mana creatures =
#     `mana-dork`, Land ramp = `land-ramp` + `extra-land` (play/put extra lands).
#     Dropping Ramp would strip 342 owned ramp cards (rituals, `combat-ramp`,
#     Utopia Sprawl-style enchantments, `mana-increaser`) of ramp — 73 of any function.
#   - Cantrip ⊂ Card draw and Reanimation ⊂ Recursion upstream (every card in
#     the narrower root is in the broader one); kept as narrower functions.
#   - Burn = `burn` (player + creature + battle damage), so it overlaps Removal
#     through `removal-burn` — expected.
#   - Discard = `discard` (makes a player discard: hand disruption), NOT
#     `discard-outlet` (loot/rummage — your own discard as a cost).
#   - Mill = `mill` (self-mill + opponent mill; self-mill incl. surveil is a
#     graveyard-deck function too). Graveyard hate = `hate-graveyard`.
#   - +1/+1 counters = `gives-pp-counters` (puts counters on others) +
#     `pp-counters-matter` (payoffs), NOT `gains-pp-counters` (creatures that
#     grow themselves — a keyword, not a deck function).
#   - Haste enabler = `gives-haste` (not `gains-haste`, the creature's own keyword).
#   - Blink = `flicker`; Cost reduction = `cost-reducer`; Extra combat =
#     `extra-combat-phase` (only ~27 owned cards, kept: distinctive and nothing
#     else covers it); Death trigger = `death-trigger`; Utility land =
#     `utility-land`; Mana sink = `mana-sink`; Anthem = `anthem`;
#     Combat trick = `combat-trick`; Cantrip = `cantrip`.
#   - No candidate was dropped: every one covered ≥27 owned cards and none
#     duplicated another root outright.

# Max oracle tags shown per card in previews (highest weight first).
preview_limit = 6

# Structural / meta subtrees never shown as a card's preview tags.
preview_exclude = [
  "card-names", "cycle", "flavors-of-vanilla", "type-errata", "unique-type-line",
  "triggered-ability", "activated-ability", "cheaper-than-mv",
  "more-expensive-than-mv", "staple-with-set-s-mechanic", "token-errata",
  "single-target-instant-sorcery", "drawback", "meme",
]


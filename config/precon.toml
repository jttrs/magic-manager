# Precon / sealed-pool classification constants (mtgjson.py).
#
# Externalized from Python constants; code ships identical baked-in defaults, so
# this file is OPTIONAL. Edit here to retune without code changes.

# The product `type` strings `mm set precon-list` lists by default — the
# constructed-deck products a collector tracks (mtgjson.PRECON_MODERN_TYPES).
# When a product line is reported missing from precon-list, add its exact MTGJSON
# `type` string here.
modern_types = [
    "Commander Deck", "Box Set", "Duel Deck", "Planeswalker Deck",
    "Starter Deck", "Starter Kit", "Spellslinger Starter Kit", "Welcome Deck",
    "Intro Pack", "Challenger Deck", "Pioneer Challenger Deck", "Guild Kit",
    "Brawl Deck", "Clash Pack", "Game Night Deck", "Archenemy Deck",
    "Planechase Deck",
]

# A product whose name matches one of these substrings (case-insensitive) has NO
# real decklist → its loose cards default to `deconstructed`
# (mtgjson.POOL_NAME_PATTERNS).
pool_name_patterns = ["scene box", "starter collection"]

# A single-deck product with more than this many cards is pool-shaped (a card
# dump, not an assembled deck) → defaults to deconstructed
# (mtgjson.POOL_CARD_COUNT_THRESHOLD).
pool_card_count_threshold = 150

# Product `type` strings that are ALWAYS a card pool, never a playable deck
# (mtgjson.POOL_PRODUCT_TYPES) — e.g. land packs.
pool_product_types = ["Bundle Land Pack"]

# A Secret Lair Drop with fewer playable cards than this is a pool
# (mtgjson.SLD_MIN_PLAYABLE_CARDS).
sld_min_playable_cards = 40

# Any product with fewer playable cards than this is a pool, except Archenemy
# scheme decks (mtgjson.MIN_PLAYABLE_CARDS).
min_playable_cards = 20

# ---- Page-tag stores ----

[[vendor]]
key = "forgeandfire"
name = "Forge and Fire Gaming"
hosts = ["forgeandfiregaming.com"]
mode = "meta"
product_path = "^/(?!cart|checkout|account|login|search)[^/]+/[^/]+/?$"
sample_url = "https://forgeandfiregaming.com/magic-the-gathering/final-fantasy-play-booster-display/"

[[vendor]]
key = "coolstuff"
name = "CoolStuffInc"
hosts = ["coolstuffinc.com"]
mode = "meta"
product_path = "^/p/\\d+"
sample_url = "https://www.coolstuffinc.com/p/408893"

[[vendor]]
key = "starcity"
name = "Star City Games"
hosts = ["starcitygames.com"]
mode = "meta"
product_path = "^/[a-z0-9-]+-(?:en|jp|ja)/?$"
sample_url = "https://starcitygames.com/final-fantasy-play-booster-box-sld-mtg-bbx-finplay-en/"
stock_pattern = '"instock":\s*true'
sold_out_pattern = '"instock":\s*false'

[[vendor]]
key = "miniaturemarket"
name = "Miniature Market"
hosts = ["miniaturemarket.com"]
mode = "meta"
product_path = "\\.html$"
sample_url = "https://www.miniaturemarket.com/mtg-universes-beyond-final-fantasy-play-booster-box-30-wocd3842-box.html"

[[vendor]]
key = "gamenerdz"
name = "GameNerdz"
hosts = ["gamenerdz.com"]
mode = "meta"
product_path = "^/(?!cart|checkout|account|login|search|categories|brands)[a-z0-9-]+/?$"
sample_url = "https://www.gamenerdz.com/riftbound-league-of-legends-tcg-radiance-booster-box-preorder"

[[vendor]]
key = "nobleknight"
name = "Noble Knight Games"
hosts = ["nobleknight.com"]
mode = "meta"
product_path = "^/P/\\d+"
sample_url = "https://www.nobleknight.com/P/2148327420/Edge-of-Eternities---Play-Booster-Display"

[[vendor]]
key = "dragonslair"
name = "Dragon's Lair Hobbies"
hosts = ["dragonslairhobbies.com"]
mode = "meta"
product_path = "^/product/[^/]+"
sample_url = "https://dragonslairhobbies.com/product/magic-the-gathering-teenage-mutant-ninja-turtles-play-booster-display/"

[[vendor]]
key = "costco"
name = "Costco"
hosts = ["costco.com"]
mode = "meta"
product_path = "(\\.product\\.\\d+\\.html$|^/p/-/[^/]+/\\d+)"
sample_url = "https://www.costco.com/p/-/magic-the-gathering-bloomburrow-commander-kit-peace-offering/4000399539"

[[vendor]]
key = "cardkingdom"
name = "Card Kingdom"
hosts = ["cardkingdom.com"]
mode = "meta"
product_path = "^/mtg-sealed/[^/]+"
sample_url = "https://www.cardkingdom.com/mtg-sealed/edge-of-eternities-play-booster-box"
# The og:title is an unfilled template ("title | edition | …"): take the heading.
title_pattern = '<h1[^>]*>\s*(.*?)\s*</h1>'
stock_pattern = 'Add To Cart\s*</a>'
sold_out_pattern = '>\s*(?:Out of Stock|Sold Out)\s*<'

# ---- Read from your open tab ----

[[vendor]]
key = "bestbuy"
name = "Best Buy"
hosts = ["bestbuy.com"]
mode = "rendered"
product_path = "^/(site|product)/.+"
# The first $ amount is the price; the second is the ÷4 installment.
price_pattern = '\$\s?(\d[\d,]*\.\d{2})'
sold_out_pattern = 'sold out|out of stock|coming soon'

[[vendor]]
key = "target"
name = "Target"
hosts = ["target.com"]
mode = "rendered"
product_path = "^/p/.+/-/A-\\d+"
price_pattern = '\$\s?(\d[\d,]*\.\d{2})'
sold_out_pattern = 'out of stock|sold out|not available'

[[vendor]]
key = "ebay"
name = "eBay"
hosts = ["ebay.com"]
mode = "rendered"
product_path = "^/itm/\\d+"
# The first "US $" amount is the item price; later ones are installments/shipping.
price_pattern = 'US \$\s?(\d[\d,]*\.\d{2})'
sold_out_pattern = 'this listing (?:was ended|has ended)|out of stock|sold out'

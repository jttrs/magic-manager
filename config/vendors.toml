# The vendor recipe book — which stores the deals tools read, and how.
# Design + failure modes: docs/deals-scraping.md. Loaded by magic_manager.vendors.
#
#   mode           shopify  — server GET <product-url>.js (Shopify storefront: cents + availability)
#                  meta     — server GET, price/stock from page tags (product/og meta,
#                             schema.org JSON-LD, microdata), then the patterns below
#                  rendered — read the page already open in your browser tab (bot-blocked
#                             or JS-priced stores); never fetched server-side
#   product_path   regex on the URL path that marks a product page
#   sample_url     one known product page — the nightly canary reads it (server modes)
#   no_sales_tax   cross-store tiebreaker only; deal deltas are always at face price
#   price_pattern / stock_pattern / sold_out_pattern / title_pattern
#                  optional regexes (first group = value) when page tags aren't enough;
#                  for `rendered` they run over the tab's visible text.
#                  (case-insensitive; ^ and $ anchor a line)
#   seller_pattern / condition_pattern
#                  regexes (group 1) for the main offer's seller / condition when
#                  JSON-LD doesn't say (JSON-LD offers.seller / itemCondition win)
#   sellers        the store's own seller names — an offer sold by anyone else
#                  isn't counted ("Sold by a third-party seller (X)")
#   new_only       a used / pre-owned / renewed offer isn't counted
#   no_offer_pattern  the page has no main offer (its prices are other items')
#   title_strip    regex removed from the title (store name / category noise)

# ---- Shopify stores ----

[[vendor]]
key = "manyrealms"
name = "Many Realms"
hosts = ["manyrealms.com"]
mode = "shopify"
product_path = "/products/[^/?#]+"
sample_url = "https://manyrealms.com/products/magic-the-gathering-foundations-play-booster-box"
no_sales_tax = true

